        contactName:
          type: object
        phone:
          type: string
        email:
          type: object
        notes:
          type: object
        instructions:
          type: object
        customApptFieldsTemplate:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldTemplateDto'
        refNumberValidationVersion:
          type: string
          enum:
          - V1
          - V2
