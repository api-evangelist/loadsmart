  description: Production Server
- url: https://neutron.staging.opendock.com
  description: Staging Server
tags:
- name: YMS - Spot Assignment
paths:
  /yard/spot-assignment:
    post:
      operationId: createOneBaseSpotAssignmentControllerSpotAssignment
      summary: Create a single SpotAssignment
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpotAssignmentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpotAssignment'
      tags:
      - YMS - Spot Assignment
      security:
      - bearer: []
    get:
      operationId: getManyBaseSpotAssignmentControllerSpotAssignment
      summary: Retrieve multiple SpotAssignments
      parameters:
      - name: fields
        description: Selects resource fields. <a href="https://github.com/nestjsx/crud/wiki/Requests#select" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: s
        description: Adds search condition. <a href="https://github.com/nestjsx/crud/wiki/Requests#search" target="_blank">Docs</a>
