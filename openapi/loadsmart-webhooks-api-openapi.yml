  /quote-webhooks:
    post:
      summary: Quote Events
      description: "Posts a message when an event about a quote is triggered.\n\nThe quote event payload has a base schema but the details change depending on the event type.\nDuring the onboarding you can let Loadsmart know which events you want to receive. You can also\nreceive events in more than one URL.\n\nList of event types:\n  - quote:booked\n  - quote:rejected\n"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: quote:booked
                properties:
                  details:
                    type: object
                    properties:
                      event:
                        type: object
                        properties:
                          sender_id:
                            type:
                            - string
                            - 'null'
                            description: The identification of the party that is sending this message
                          receiver_id:
                            type:
                            - string
                            - 'null'
                            description: The identification of the party that is receiving this message
                      shipment:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipment identifier
                          bol_number:
                            type: string
                            description: The bill of lading number
                          equipment_type:
                            type: string
                            description: The type of truck used to move the load
                          equipment_size:
                            type: integer
                            description: The size of the truck used to move the load, in feet
                          purchase_order_number:
                            type:
                            - string
                            - 'null'
                            description: The Purchase Order (PO) number
                          ref_number:
                            type: string
                            description: The load number from its shipper
                          loadsmart_ref_number:
                            type: string
                            description: Internal identifier
                          stops:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  format: date-time
                                  description: The date and time of the stop
                                city:
                                  type: string
                                  description: This stop city
                                state:
                                  type: string
                                  description: This stop state
                                country:
                                  type: string
                                  description: This stop country
                                zipcode:
                                  type: string
                                  description: This stop zipcode
                                timezone:
                                  type: string
                                  description: This stop timezone
                                stop_index:
                                  type: number
                                  description: Indicate the stop number for this event, being 0-based for pickup.
                                location:
                                  type: object
                                  description: General localization attributes
                                  properties:
                                    latitude:
                                      type: number
                                      description: The latitude where the stop is located
                                    longitude:
                                      type: number
                                      description: The longitude where the stop is located
                      shipper:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipper identifier
                          name:
                            type: string
                            description: The shipper name
                  created_at:
                    type: string
                    format: date-time
                    description: The date and time of the event.
                  type:
                    type: string
                    description: Event type
              - type: object
                title: quote:rejected
                properties:
                  details:
                    type: object
                    properties:
                      quote:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The quote identifier
                          customer_reference:
                            type: string
                            description: The quoted shipment identifier on the shipper side
                      shipper:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipper identifier
                          name:
                            type: string
                            description: The shipper name
                  created_at:
                    type: string
                    format: date-time
                    description: The date and time of the event.
                  type:
                    type: string
                    description: Event type
            examples:
              BookedQuote:
                value:
                  type: quote:booked
                  created_at: 2019-09-09 14:14:14.044000+00:00
                  details:
                    event:
                      sender_id: Loadsmart
                      receiver_id: Your Company
                    shipment:
                      id: 515cf5a61d004b87abecc6988d75619c
                      bol_number: FHC-1234BR
                      equipment_type: DRV
                      equipment_size: 53
                      purchase_order_number: GA452686
                      ref_number: SKT8678K
                      stops:
                      - city: Orange
                        state: MA
                        zipcode: '01364'
                        country: USA
                        stop_index: 0
                        date: 2018-09-19 13:30:00-04:00
                        location:
                          latitude: 42.35725
                          longitude: -72.18648
                      - city: Red Bluff
                        state: CA
                        zipcode: '96080'
                        country: USA
                        stop_index: 1
                        date: 2018-09-22 17:00:00-04:00
                        location:
                          latitude: 40.043325
                          longitude: -122.34648
                    shipper:
                      id: 5d5f9e1b49d543eba0d5744237357e66
                      name: Stark Industries
              RejectedQuote:
                value:
                  type: quote:rejected
                  created_at: 2019-09-09 14:14:14.044000+00:00
                  details:
                    quote:
                      id: 556152bb26824d1abc65ba2d0af1532d
                      customer_reference: DAY2357V
                    shipper:
                      id: db0da78773884ecd9975af1c9d53e8b8
                      name: Acme Inc.
      responses:
        '200':
          description: Event received
