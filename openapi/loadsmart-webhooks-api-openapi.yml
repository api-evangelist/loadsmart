  /carrier-webhooks:
    post:
      summary: Carrier Events
      description: 'Posts a message when an event about a Carrier is triggered.

        '
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: carrier:status:changed
                properties:
                  details:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique Identifier of the Carrier on Loadsmart
                      mc:
                        type: string
                        format: integer
                        description: Carrier Interstate Operating Authority (MC number)
                      dot:
                        type: string
                        format: integer
                        description: Carrier US DOT Number
                      name:
                        type: string
                        description: Carrier legal name
                      eligible:
                        type: bool
                        description: Flag that report if the Carrier is eligible to carry loads
                      status:
                        type: string
                        enum:
                        - New
                        - Pending
                        - Ready
                        - Inactive
                        description: Carrier status on Loadsmart
                      previous_status:
                        type: string
                        enum:
                        - New
                        - Pending
                        - Ready
                        - Inactive
                        description: Carrier previous status on Loadsmart
                  created_at:
                    type: string
                    format: date-time
                    description: The date and time of the event.
                  type:
                    type: string
                    description: Event type
                    enum:
                    - carrier:status:changed
            examples:
              carrier:status:changed:
                value:
                  type: carrier:status:changed
                  created_at: 2022-08-30 10:45:00+00:00
                  details:
                    id: 9b739d7a-b4db-45f7-a61b-990c7ac77082
                    dot: '2953461'
                    mc: '456'
                    status: Ready
                    previous_status: Pending
                    eligible: true
                    name: J R T TRANS CORP
      responses:
        '200':
          description: Event received
      tags:
      - Webhooks
  /integration-request:
    post:
      summary: Integration Request Events
      description: "Posts a message when an event about an integration request is triggered.\n\nThe event payload has the same schema for both integration-request events.\n\nList of event types:\n  - integration-request:accepted\n  - integration-request:rejected\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                created_at:
                  type: string
                  format: date-time
                  description: The date and time of the event.
                type:
                  type: string
                  description: Event type
                details:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Unique Identifier of the Integration Request
                    carrier_id:
                      type: string
                      format: uuid
                      description: Unique Identifier of the Carrier on Loadsmart
                    mc:
                      type: string
                      description: Carrier Interstate Operating Authority (MC number)
                    dot:
                      type: string
                      description: Carrier US DOT Number
                    name:
                      type: string
                      description: Carrier legal name
                    status:
                      type: string
                      enum:
                      - pending
                      - accepted
                      - rejected
                      description: 'Status of the Integration Request

                        - pending: waiting/under evaluation from Carrier owner and/or Loadsmart

                        - accepted: Integration Request accepted

                        - rejected: Integration Request rejected by Carrier owner and/or Loadsmart

                        '
            example:
              type: integration-request:accepted
              created_at: 2018-06-19 10:30:00+00:00
              details:
                id: 5d5f9e1b-49d5-43eb-a0d5-744237357e66
                carrier_id: 7c5b89cc-53fe-4e7a-9cf2-47a725e631a5
                dot: '123'
                mc: '456'
                name: Stark Industries
                status: accepted
      responses:
        '200':
          description: Event received
      tags:
      - Webhooks
components:
  securitySchemes:
    Application-JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorize the request with the application context (preferred\nfor the endpoints that support it):\n\n```\n{\n  \"sub\": \"sys\",\n  \"iss\": \"token-issuer\",\n  \"exp\": 1626239022,\n  \"iat\": 1517239022\n}\n```\n"
    User-JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorize the request with an user context. A payload example\nwould be:\n\n```\n{\n  \"sub\": \"usr:87127882-d1db-4e50-8f7c-c792a80d7c49\",\n  \"iss\": \"token-issuer\",\n  \"iat\": 1517239022,\n  \"exp\": 1626239022\n}\n```\n"
