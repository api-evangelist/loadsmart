  /shipment-webhooks:
    post:
      summary: Shipment Events
      description: "Posts a message when an event about a shipment is triggered.\n\nThe shipment event payload has a base schema but the details change depending on the event type.\nDuring the onboarding you can let Loadsmart know which events you want to receive. You can also\nreceive events in more than one URL.\n\nList of event types:\n  - shipment:appointment-pickup\n  - shipment:appointment-delivery\n  - shipment:en-route-to-pickup\n  - shipment:check-in-pickup\n  - shipment:check-out-pickup\n  - shipment:check-in-delivery\n  - shipment:check-out-delivery\n  - shipment:carrier-updated\n  - shipment:carrier-dropped\n  - shipment:location-updated\n  - shipment:driver-assigned\n  - shipment:driver-unassigned\n  - shipment:canceled\n  - shipment:incident\n  - shipment:invoice\n  - shipment:updated\n  - shipment:created\n"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: shipment:appointment-pickup
                properties:
                  details:
                    type: object
                    properties:
                      shipment:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipment identifier
                          loadsmart_ref_number:
                            type: string
                            description: Internal identifier
                          bol_number:
                            type: string
                            description: Bill of Lading number
                          equipment_type:
                            type: string
                            description: The type of truck used to move the load
                          trailer_number:
                            type: string
                            description: Carriers trailer number
                          ref_number:
                            type: string
                            description: Reference number
                          carrier_pro:
                            type: string
                            description: Carrier PRO Number is often used for by LTL carriers as a key identifier for their shipments.
                          truck_license_plate:
                            type: string
                            description: License Plate attached to a truck for official identification purposes.
                          weight:
                            type: string
                            description: Shipment's weight (string formatted decimal)
                          must_arrive_by_date:
                            type: string
                            description: Deadline to delivery load
                          must_ship_by_date:
                            type: string
                            description: Deadline to ship load
                          container:
                            type:
                            - object
                            - 'null'
                            description: Container related info
                            properties:
                              is_live:
                                type: boolean
                                description: True if it is a live load, False if it is a drop load
                              number:
                                type: string
                                description: Unique container identifier
                              ocean_bol_number:
                                type: string
                                description: Ocean bill of lading identifier number
                          stops:
                            type: array
                            description: All shipment stops
                            minItems: 1
                            items:
                              type: object
                              properties:
                                city:
                                  type: string
                                  description: This stop city
                                state:
                                  type: string
                                  description: This stop state
                                country:
                                  type: string
                                  description: This stop country
                                stop_customer_ref:
                                  type: string
                                  description: Shipper identifier for the stop
                                facility_ref:
                                  type: string
                                  description: Shipper identifier for the facility
                                zipcode:
                                  type: string
                                  description: This stop zipcode
                                timezone:
                                  type: string
                                  description: This stop timezone
                                stop_index:
                                  type: number
                                  description: Indicate the stop number for this event, being 0-based for pickup.
                                location:
                                  description: General location attributes
                                  properties:
                                    gln:
                                      type:
                                      - string
                                      - 'null'
                                      description: GS1 Global Location Number if registered.
                                    latitude:
                                      type: number
                                      description: The latitude where the stop is located
                                    longitude:
                                      type: number
                                      description: The longitude where the stop is located
                                facility:
                                  description: Facility information
                                  properties:
                                    company_name:
                                      type: string
                                      description: Facility's company name
                                    city:
                                      type: string
                                      description: Facility's city
                                    state:
                                      type: string
                                      description: Facility's state
                                    zipcode:
                                      type: string
                                      description: Facility's zipcode
                                    timezone:
                                      type: string
                                      description: Facility's timezone
                                    location:
                                      description: General location attributes
                                      properties:
                                        gln:
                                          type:
                                          - string
                                          - 'null'
                                          description: GS1 Global Location Number if registered.
                                        latitude:
                                          type: number
                                          description: The latitude where the stop is located
                                        longitude:
                                          type: number
                                          description: The longitude where the stop is located
                                    contact:
                                      description: Facility contact information
                                      properties:
                                        first_name:
                                          type: string
                                        last_name:
                                          type: string
                                        phone_number:
                                          type: string
                                        email:
                                          type: string
                          properties:
