  /load-webhooks:
    post:
      summary: Load Events
      description: "Posts a message when an event about a load is triggered.\n\nThe load event payload has a base schema but the details change depending on the event type.\nDuring the onboarding you can let Loadsmart know which events you want to receive. You can also\nreceive events in more than one URL.\n\nDifference between load and shipment:\n\nAlthough loads and shipments usually refer to the same thing, Loadsmart handles them\nas two slightly different entities. Up to the point when a load is tendered and booked,\nthe entity in play is a \"load\". After this load is booked, it becomes a shipment.\nFrom this point on, communication is done with the shipment.\n\nList of event types:\n  - load:rejected\n  - load:accepted\n"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: load:accepted
                properties:
                  details:
                    type: object
                    properties:
                      shipment:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipment identifier
                      load:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The load identifier received in the /api/v2/loads/tender endpoint
                          ref_number:
                            type: string
                            description: The load identifier on the customer's side
                          properties:
                            type: object
                            description: 'General information about the load.

                              This is an open JSON field that allows passing special properties with meaning on the customer context, such as the order numbers, must_arrive_by_date, and others.

                              '
                      shipper:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipper identifier
                  created_at:
                    type: string
                    format: date-time
                    description: The date and time of the event.
                  type:
                    type: string
                    description: Event type
              - type: object
                title: load:rejected
                properties:
                  details:
                    type: object
                    properties:
                      load:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The load identifier received in the /api/v2/loads/tender endpoint
                          ref_number:
                            type: string
                            description: The load identifier on the customer's side
                          properties:
                            type: object
                            description: 'General information about the load.

                              This is an open JSON field that allows passing special properties with meaning on the customer context, such as the order numbers, must_arrive_by_date, and others.

                              '
                      shipper:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: The shipper identifier
                  created_at:
                    type: string
                    format: date-time
                    description: The date and time of the event.
                  type:
                    type: string
                    description: Event type
            examples:
              load:accepted:
                value:
                  type: load:accepted
                  created_at: 2018-06-19 10:45:00+00:00
                  details:
                    shipper:
                      id: db0da787-7388-4ecd-9975-af1c9d53e8b8
                    load:
                      id: 06aa28df-4f5c-4db7-b779-270f27e21713
                      ref_number: DAY2357V
                      properties:
                        customer_id: 123456
                        custom_field: custom_value
                    shipment:
                      id: 0bec679a-df08-4c60-8b97-0ff702fa8729
              load:rejected:
                value:
                  type: load:rejected
                  created_at: 2019-09-09 14:14:14.044000+00:00
                  details:
                    shipper:
                      id: db0da78773884ecd9975af1c9d53e8b8
                    load:
                      id: 06aa28df4f5c4db7b779270f27e21713
                      ref_number: DAY2357V
                      properties:
                        customer_id: 123456
                        custom_field: custom_value
      responses:
        '200':
          description: Event received
      tags:
      - Webhooks
