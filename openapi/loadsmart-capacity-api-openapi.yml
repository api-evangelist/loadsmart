          description: All provided data is valid and the available trucks are being created
        '422':
          description: Payload is invalid and a capacity can't be created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_data
                  error_description:
                    type: string
                    description: Description of what happened
