            examples:
              Spot Capacity:
                value:
                - available_at: 2018-11-22 10:00:00
                  carrier_id: 9f87d040-f843-42e7-887a-45bea55e76f3
                  ref_number: c6786277-e20e-4e0e-b28b-972d7bac365b
                  fleet_id: XYZ123
