                            type: boolean
                          teams:
                            type: boolean
                          tsa:
                            type: boolean
                          twic:
                            type: boolean
                          vented_vans:
                            type: boolean
                      ref_number:
                        type: string
                        description: Human readable Load reference number.
                    required:
                    - ref_number
                    - equipment_type
                  actions:
                    type: object
                    properties:
                      redirect_url:
                        type: string
                        description: URL of offer on Loadsmart website.
                      accept_url:
                        type: string
                        description: URL to accept the offer via API (must be a POST method).
