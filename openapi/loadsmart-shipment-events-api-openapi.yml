                          - refused_customer
                          - road_conditions
                          - shipment_overweight
                          - shipper_related
                          - trailer_not_available
                          - unable_locate
                          - waiting_shipping_instructions
                        eta:
                          type: string
                          format: date-time
                          description: A new ETA after the incident
                        notes:
                          type: string
                          description: Any additional information
                      required:
                      - type
                    - type: object
                      title: shipment:carrier-updated
                      properties:
                        tractor_number:
                          type:
                          - string
                          - 'null'
                          maxLength: 70
                        trailer_number:
                          type:
                          - string
                          - 'null'
                          maxLength: 70
                required:
                - type
            example:
              type: shipment:check-in-pickup
              event_date: 2018-06-19 14:30:00+00:00
              stop_index: 0
        required: true
      responses:
        '201':
          description: Event successfully created
        '404':
          description: Shipment not found
        '409':
          description: Load status transition not allowed.
        '422':
          description: Payload is invalid and the event can't be created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_data
                  error_description:
                    type: string
                    description: Description of what happened
                  errors:
                    type: object
                    description: Object where each field is a key and the value is an array of errors
                required:
                - error
                - error_description
              example:
                error: invalid_data
                error_description: Can't create the object
                errors:
                  field_name:
                  - This field is required.
                  other_field:
                  - Expected string but received integer.
      tags:
      - Shipment Events
    get:
      summary: List shipment events.
      description: List shipment events.
      security:
      - User-JWT:
        - shipment_read
      parameters:
      - in: path
        name: shipment_id
        required: true
        schema:
          description: Shipment or Load UUID
          type: string
          format: uuid
      - in: query
        name: offset
        schema:
          description: The initial item number, starting at 0 (zero)
          type: integer
          format: int32
      - in: query
        name: limit
        schema:
          description: The number of items per page
          type: integer
          format: int32
      - in: query
        name: type
        schema:
          description: A filter by the event type
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: An array of events
                    items:
                      oneOf:
                      - type: object
                        title: shipment:appointment-pickup
                        properties:
                          details:
                            type: object
