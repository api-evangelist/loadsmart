servers:
- url: https://neutron.opendock.com
  description: Production Server
- url: https://neutron.staging.opendock.com
  description: Staging Server
tags:
- name: Appointments
paths:
  /appointment:
    get:
      operationId: getManyBaseAppointmentControllerAppointment
      summary: Retrieve multiple Appointments
      parameters:
      - name: fields
        description: Selects resource fields. <a href="https://github.com/nestjsx/crud/wiki/Requests#select" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: s
        description: Adds search condition. <a href="https://github.com/nestjsx/crud/wiki/Requests#search" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: string
      - name: filter
        description: Adds filter condition. <a href="https://github.com/nestjsx/crud/wiki/Requests#filter" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: or
        description: Adds OR condition. <a href="https://github.com/nestjsx/crud/wiki/Requests#or" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: sort
        description: Adds sort by field. <a href="https://github.com/nestjsx/crud/wiki/Requests#sort" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: join
        description: Adds relational resources. <a href="https://github.com/nestjsx/crud/wiki/Requests#join" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: limit
        description: Limit amount of resources. <a href="https://github.com/nestjsx/crud/wiki/Requests#limit" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: integer
      - name: offset
        description: Offset amount of resources. <a href="https://github.com/nestjsx/crud/wiki/Requests#offset" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: integer
      - name: page
        description: Page portion of resources. <a href="https://github.com/nestjsx/crud/wiki/Requests#page" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: integer
      - name: cache
        description: Reset cache (if was enabled). <a href="https://github.com/nestjsx/crud/wiki/Requests#cache" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedDto'
                - properties:
                    entity:
                      type: string
                      example: AppointmentListItemDto
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AppointmentListItemDto'
      tags:
      - Appointments
      security:
      - bearer: []
    post:
      operationId: createOneBaseAppointmentControllerAppointment
      summary: Create a single Appointment
      parameters:
      - name: bypassCustomFieldsValidation
        required: true
        in: query
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: create
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/requirements:
    get:
      operationId: AppointmentController_getAppointmentRequirements
      parameters:
      - name: loadTypeId
        required: true
        in: query
        description: Identifies a LoadType.
        schema:
          type: string
      - name: warehouseId
        required: true
        in: query
        description: Identifies a Warehouse.
        schema:
          type: string
      - name: start
        required: true
        in: query
        description: The start date of appointment creations.
        schema:
          format: date-time
          type: string
      - name: end
        required: true
        in: query
        description: The end date of appointment creations.
        schema:
          format: date-time
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentRequirementsSuccessResponseDto'
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/{id}:
    get:
      operationId: getOneBaseAppointmentControllerAppointment
      summary: Retrieve a single Appointment
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: fields
        description: Selects resource fields. <a href="https://github.com/nestjsx/crud/wiki/Requests#select" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: join
        description: Adds relational resources. <a href="https://github.com/nestjsx/crud/wiki/Requests#join" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: cache
        description: Reset cache (if was enabled). <a href="https://github.com/nestjsx/crud/wiki/Requests#cache" target="_blank">Docs</a>
        required: false
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: read
      tags:
      - Appointments
      security:
      - bearer: []
    delete:
      operationId: deleteOneBaseAppointmentControllerAppointment
      summary: Delete a single Appointment
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAppointmentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: delete
      tags:
      - Appointments
      security:
      - bearer: []
    patch:
      operationId: updateOneBaseAppointmentControllerAppointment
      summary: Update a single Appointment
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: update
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/public/{id}:
    get:
      operationId: AppointmentController_getPublicAppointmentDetails
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentListItemDto'
      tags:
      - Appointments
  /appointment/{id}/set-eta:
    patch:
      operationId: AppointmentController_setEta
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtaDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: update
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/{id}/undo-latest-status:
    patch:
      operationId: AppointmentController_undoLatestStatus
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: update
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/reserve:
    post:
      operationId: AppointmentController_createReserve
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReserveDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: create
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/{id}/recurring:
    post:
      operationId: AppointmentController_createRecurringAppointments
      summary: Creates a Recurring Appointment Series based on this appointment
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringAppointmentsDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/RecurringAppointmentCreateResponse'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: create
      tags:
      - Appointments
      security:
      - bearer: []
    delete:
      operationId: AppointmentController_deleteRecurringAppointments
      summary: Deletes this appointment and all following appointments in the recurring series, except the original appointment used to create this series.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: delete
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/email-notification-html/{emailKey}:
    get:
      operationId: AppointmentController_getAppointmentNotificationEmailHtml
      parameters:
      - name: emailKey
        required: true
        in: path
        schema:
          type: string
      - name: warehouseId
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentNotificationEmailHtmlResponseDto'
      tags:
      - Appointments
      security:
      - bearer: []
  /appointment/{id}/tag:
    post:
      operationId: AppointmentController_addAppointmentTag
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAppointmentTagDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: update
      tags:
      - Appointments
      security:
      - bearer: []
    delete:
      operationId: AppointmentController_removeAppointmentTag
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAppointmentTagDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AppointmentListItemDto'
                  entity:
                    type: string
                    example: Appointment
                  action:
                    type: string
                    example: update
      tags:
      - Appointments
