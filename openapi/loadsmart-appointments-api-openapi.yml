        required:
          type: boolean
          description: Whether this field is required when creating an appointment.
        example:
          type: object
          description: Example value for this field; shape depends on warehouse, load type, and field type.
        acceptedValues:
          type: object
          description: Allowed or described values (e.g. UUID lists, maps of dock id to slot times, free-text rules).
        description:
          type: string
          description: How to supply this field on appointment creation.
      required:
      - type
