      - bearer: []
components:
  schemas:
    CreateAppointmentDto:
      type: object
      properties:
        tags:
          type: object
        status:
          type: string
          enum:
          - NoShow
          - Cancelled
          - Requested
          - Scheduled
          - Arrived
          - InProgress
          - Completed
        userId:
          type: object
        loadTypeId:
          type: string
        dockId:
          type: string
        start:
          format: date-time
          type: string
        end:
          format: date-time
          type: string
        refNumbers:
          type: array
          items:
            type: string
        refNumber:
          type: string
        customFields:
          type: array
          items:
            type: string
        notes:
          type: string
        ccEmails:
