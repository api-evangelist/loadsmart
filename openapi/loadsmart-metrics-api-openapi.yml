components:
  schemas:
    YardExportDataDto:
      type: object
      properties: {}
    MetricsCountsAppointmentCountForCarrierResponse:
      type: object
      properties:
        data:
          type: object
          example:
          - org_name: My carrier org name
            appointmentCount: 45
      required:
      - data
    MetricsAppointmentVolumeByStatusResponse:
      type: object
      properties:
        data:
          type: object
          example:
            Scheduled: '6'
            Arrived: '2'
            Completed: '5'
            NoShow: '1'
            Cancelled: '0'
      required:
      - data
    AppointmentMetricsCapacityDto:
      type: object
      properties:
        dockIds:
          type: array
          items:
            type: string
    AssetVisitExcelExportDto:
      type: object
      properties:
        warehouseIds:
          type: array
          items:
            type: string
        carrierIds:
          type: array
          items:
            type: string
        statuses:
          type: array
          items:
            type: string
            enum:
            - Arrived
            - Docked
            - Departed
            - Canceled
        fromDate:
          type: string
        toDate:
          type: string
        dateField:
          type: string
          enum:
          - checkInDate
          - checkOutDate
        exportFields:
          type: array
          items:
            type: string
    MetricsCountsAppointmentCountForDocksResponse:
      type: object
      properties:
        data:
          type: object
          example:
          - dock_id: c09e393a-0916-444a-a1a8-4e605a07618e
            count: 72
      required:
      - data
    MetricsAppointmentVolumeByDateResponse:
      type: object
      properties:
        data:
          type: object
          example:
            05/16/2023: '1'
            05/30/2023: '1'
            06/02/2023: '1'
            06/09/2023: '2'
      required:
      - data
    MetricsAppointmentVolumeByLoadTypeResponse:
      type: object
      properties:
        data:
          type: object
          example:
            MyLoadType:
              sunday: 0
              monday: 3
              tuesday: 2
              wednesday: 5
              thursday: 7
              friday: 5
              saturday: 0
            AnotherLoadType:
              sunday: 0
              monday: 2
              tuesday: 3
              wednesday: 2
              thursday: 5
              friday: 4
              saturday: 0
      required:
      - data
    MetricsAppointmentVolumeByCarrierResponse:
      type: object
      properties:
        data:
          type: object
          example:
            Raphael: '5'
            Josh: '7'
            Mike: '3'
